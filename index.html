<style>
  :root{
    --bg:#F6F4EE;
    --surface: #FFFFFF;
    --ink:#182625;
    --ink-soft:#54615F;
    --primary:#0F6E5D;
    --primary-dark:#0A4F43;
    --primary-soft:#E3F1EC;
    --amber: #B4791A;
    --amber-soft: #FBF0DC;
    --danger:#AE3A34;
    --danger-soft:#FBE9E7;
    --line:#E4DFD1;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background:#EDEAE0;
    color:var(--ink);
    font-size:15px;
    line-height:1.45;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:64px;
  }
  @media (min-width: 760px){
    body{ display:flex; justify-content:center; align-items:flex-start; padding:32px 16px; }
    #app{ min-height:calc(100vh - 64px); box-shadow:0 10px 40px rgba(24,38,37,.12); border-radius:16px; overflow:hidden; }
    nav.tabbar, .checkout-bar, .modal-back{ max-width:480px; }
  }
  #splash{
    position:fixed; inset:0; background:var(--primary-dark); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:100;
  }
  #splash .logo{ font-size:44px; }
  #splash .spin{
    width:28px; height:28px; border-radius:50%;
    border:3px solid rgba(255,255,255,.3); border-top-color:#fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .num{ font-variant-numeric: tabular-nums; }

  /* header */
  header.topbar{
    background:var(--primary-dark);
    color:#fff;
    padding:14px 16px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header.topbar .store-name{
    font-weight:700;
    font-size:17px;
    background:none;
    border:none;
    color:#fff;
    padding:0;
    font-family:inherit;
    cursor:pointer;
  }
  header.topbar .date{ font-size:12px; opacity:.8; }
  header.topbar .gear{
    background:rgba(255,255,255,.12);
    border:none;
    color:#fff;
    width:32px; height:32px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
  }

  main{ flex:1; padding:12px 12px 16px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* generic components */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
  }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .between{ justify-content:space-between; }
  .muted{ color:var(--ink-soft); font-size:13px; }
  .h2{ font-size:15px; font-weight:700; margin:2px 0 8px; }
  .btn{
    border:none; border-radius:8px; padding:10px 14px;
    font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer;
  }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-outline{ background:#fff; color:var(--primary-dark); border:1px solid var(--primary); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-ghost{ background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:6px 10px; font-size:13px; border-radius:7px; }
  .pill{
    display:inline-block; padding:3px 9px; border-radius:20px;
    font-size:11.5px; font-weight:700;
  }
  .pill-ok{ background:var(--primary-soft); color:var(--primary-dark); }
  .pill-warn{ background:var(--amber-soft); color:var(--amber); }
  .pill-bad{ background:var(--danger-soft); color:var(--danger); }
  input, select, textarea{
    font-family:inherit; font-size:14px;
    border:1px solid var(--line); border-radius:8px;
    padding:10px 10px; background:#fff; color:var(--ink);
    width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:0; }
  label{ font-size:12.5px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:4px; }
  .field{ margin-bottom:10px; }
  .field-row{ display:flex; gap:8px; }
  .field-row > .field{ flex:1; }
  hr.line{ border:none; border-top:1px solid var(--line); margin:10px 0; }

  /* bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; right:50%; transform:translateX(50%);
    width:100%; max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
    z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; font-family:inherit;
    padding:9px 2px 8px; display:flex; flex-direction:column;

  }
  nav.tabbar button .ic{ font-size:19px; }
  nav.tabbar button.active{ color:var(--primary-dark); }
  nav.tabbar button.active .ic{ filter:none; }

  /* cashier */

  .search-wrap input{ padding-right:34px; }

  .chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px; }
  .chip{
    white-space:nowrap; padding:6px 12px; border-radius:20px;
    background:#fff; border:1px solid var(--line); font-size:12.5px; font-weight:700;
    color:var(--ink-soft); cursor:pointer;

  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .prod-item{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; margin-bottom:7px; cursor:pointer;

  .prod-item:active{ background:var(--primary-soft); }
  .prod-item .name{ font-weight:700; font-size:14px; }
  .prod-item .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .prod-item .price{ font-weight:700; color:var(--primary-dark); font-size:14px; white-space:nowrap; }

  .empty{ text-align:center; color:var(--ink-soft); padding:26px 10px; font-size:13.5px; }

  .cart-card{ margin-top:4px; }
  .cart-line{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line .cname{ flex:1; font-size:13.5px; font-weight:700; }
  .cart-line .cline-total{ width:64px; text-align:left; font-weight:700; font-size:13.5px; }
  .stepper{ display:flex; align-items:center; gap:6px; }
  .stepper button{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line);
    background:#fff; font-weight:900; font-size:14px; line-height:1; cursor:pointer; color:var(--ink);
  }
  .stepper .qty{ min-width:20px; text-align:center; font-size:13px; font-weight:700; }
  .rm{ background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:0 2px; }

  .checkout-bar{
    position:fixed; bottom:60px; right:50%; transform:translateX(50%);
    width:100%; max-width:480px; padding:10px 12px;
    background:var(--surface); border-top:1px solid var(--line);
    z-index:15;
  }
  .checkout-bar .totals{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .checkout-bar .totals .lbl{ font-size:13px; color:var(--ink-soft); }
  .checkout-bar .totals .amt{ font-size:20px; font-weight:900; color:var(--primary-dark); }

  /* modal */
  .modal-back{
    position:fixed; inset:0; background:rgba(20,25,24,.45);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-back.open{ display:flex; }
  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:16px 16px 0 0; padding:16px; max-height:88vh; overflow-y:auto;
  }
  .modal-title{ font-size:16px; font-weight:900; margin-bottom:12px; }
  .modal-close{ float:left; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }

  .hidden{ display:none !important; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
  .login-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px 20px; width:100%; max-width:360px; }
  .login-logo{ font-size:38px; text-align:center; margin-bottom:6px; }
  .login-title{ font-size:18px; font-weight:900; text-align:center; margin-bottom:4px; }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:8px 10px; border-radius:8px; margin-bottom:10px; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius:9px; padding:11px; }
  .stat-box .v{ font-size:19px; font-weight:900; color:var(--primary-dark); }
  .stat-box .l{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .move-item{ padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .move-item:last-child{ border-bottom:none; }
  .move-item .top{ display:flex; justify-content:space-between; font-weight:700; }

  .receipt{ font-family:'Tajawal',sans-serif; }
  .receipt .rline{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .receipt .rline.tot{ font-weight:900; font-size:15px; border-top:1px dashed var(--line); margin-top:6px; padding-top:8px; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>

<script>
(function(){

/* ---------------- storage layer ---------------- */
const KEYS = { products:'products', sales:'sales', moves:'moves', categories:'categories', settings:'settings', users:'users', suppliers:'suppliers', parked:'parked' };
let state = { products: [], sales: [], moves: [], categories: [], settings: { storeName: 'متجري', taxRate:0, currency:'ج.م', invoiceCounter:1000 }, users: [], suppliers: [], parked: [] };
let storageOK = true;
let storageMode = 'none'; // 'firebase' | 'claude' | 'browser' | 'none'
let currentUser = null;

/* ---- Firebase (shared, cross-device) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyBqZRGwH4QcIbYlgzqLmmoz26Zmdog_6oA",
  authDomain: "story-market-35565.firebaseapp.com",
  projectId: "story-market-35565",
  storageBucket: "story-market-35565.firebasestorage.app",
  messagingSenderId: "670650453380",
  appId: "1:670650453380:web:0cd3af1a3b952ec57521d1",
  measurementId: "G-S2THL7E471"
};
let db = null;
let auth = null;
let secondaryAuth = null;
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    // تطبيق ثانوي منفصل: بيستخدم بس لحظة إنشاء مستخدم جديد من شاشة الإعدادات
    // عشان إنشاء حساب Firebase Auth لموظف جديد ميعملش تسجيل خروج تلقائي للمدير الحالي
    const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary');
    secondaryAuth = secondaryApp.auth();
  }
}catch(e){ db = null; }

// بيحول اسم المستخدم لصيغة إيميل صالحة لـ Firebase Auth (مش محتاج يكون إيميل حقيقي)
function usernameToEmail(username){
  const clean = String(username).toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');
  return `${clean || 'user'}@matgar-elashry.app`;
}

async function fsGet(key){
  const doc = await db.collection('storeData').doc(key).get();
  return doc.exists ? doc.data().value : null;
}
async function fsSet(key, value){
  await db.collection('storeData').doc(key).set({ value, updatedAt: Date.now() });
  return true;
}

/* ---- IndexedDB fallback — used automatically when Firebase/Claude storage aren't reachable ---- */
function idbOpen(){
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('storeSystemDB_v1', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(key, value){
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(db){
    try{ return await fsGet(key); }catch(e){ /* fall through */ }
  }
  if(hasClaudeStorage){
    const r = await window.storage.get(key).catch(() => null);
    return r ? r.value : null;
  }
  return idbGet(key);
}
async function storageSet(key, value){
  if(db){
    try{ return await fsSet(key, value); }catch(e){ /* fall through */ }
  }
  if(hasClaudeStorage) return window.storage.set(key, value).then(() => true);
  return idbSet(key, value);
}

async function loadAll(){
  try{
    const results = await Promise.all(Object.values(KEYS).map(k => storageGet(k).catch(() => null)));
    const [p, s, m, c, st, u, sup, pk] = results;
    state.products   = p  ? JSON.parse(p)  : seedProducts();
    state.sales       = s  ? JSON.parse(s)  : [];
    state.moves       = m  ? JSON.parse(m)  : [];
    state.categories = c  ? JSON.parse(c)  : ['عام'];
    state.settings   = st ? Object.assign({ storeName:'متجري', taxRate:0, currency:'ج.م', invoiceCounter:1000 }, JSON.parse(st)) : { storeName: 'متجري', taxRate:0, currency:'ج.م', invoiceCounter:1000 };
    state.users       = u  ? JSON.parse(u)  : [];
    state.suppliers   = sup ? JSON.parse(sup) : [];
    state.parked       = pk ? JSON.parse(pk) : [];
    storageOK = true;
    storageMode = db ? 'firebase' : (hasClaudeStorage ? 'claude' : 'browser');
    if(!p) await save('products');
    if(!c) await save('categories');
    if(!st) await save('settings');
  }catch(e){
    storageOK = false;
    storageMode = 'none';
    state.products = seedProducts();
    state.categories = ['عام'];
  }
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

async function save(which){
  if(!storageOK) return;
  try{
    await storageSet(KEYS[which], JSON.stringify(state[which]));
  }catch(e){ /* ignore, keep working in-memory */ }
}

/* ---------------- bulk CSV import ---------------- */
const CSV_HEADER_MAP = {
  'name':'name', 'اسم المنتج':'name', 'الاسم':'name',
  'barcode':'barcode', 'باركود':'barcode', 'الباركود':'barcode', 'كود':'barcode',
  'category':'category', 'فئة':'category', 'الفئة':'category',
  'buyprice':'buyPrice', 'buy price':'buyPrice', 'سعر الشراء':'buyPrice',
  'sellprice':'sellPrice', 'sell price':'sellPrice', 'سعر البيع':'sellPrice',
  'qty':'qty', 'quantity':'qty', 'الكمية':'qty',
  'minqty':'minQty', 'min qty':'minQty', 'الحد الادنى':'minQty', 'حد التنبيه':'minQty',
  'unit':'unit', 'الوحدة':'unit'
};
function mapCsvHeader(h){
  const raw = h.trim();
  return CSV_HEADER_MAP[raw.toLowerCase()] || CSV_HEADER_MAP[raw] || null;
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(lines.length < 2) return [];
  const headers = lines[0].split(',').map(mapCsvHeader);
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cells = lines[i].split(',');
    const obj = {};
    headers.forEach((key, idx) => { if(key) obj[key] = (cells[idx]||'').trim(); });
    if(obj.name) rows.push(obj);
  }
  return rows;
}
function downloadCsvTemplate(){
  const csv = 'name,barcode,category,buyPrice,sellPrice,qty,minQty,unit\nمياه معدنية 600مل,1001,مشروبات,3,5,40,10,قطعة\n';
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نموذج-استيراد-منتجات.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function importProductsCsv(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = parseCSV(reader.result);
    if(rows.length === 0){ toast('لم يتم العثور على بيانات صحيحة في الملف، تأكد من استخدام نفس شكل النموذج'); return; }
    if(!confirm(`سيتم إضافة ${rows.length} منتج جديد للنظام. متابعة؟`)) return;
    const newCats = new Set(state.categories);
    let added = 0;
    rows.forEach(r => {
      const category = r.category || 'عام';
      newCats.add(category);
      state.products.push({
        id: uid(), name: r.name, barcode: r.barcode || '', category,
        buyPrice: parseFloat(r.buyPrice) || 0, sellPrice: parseFloat(r.sellPrice) || 0,
        qty: parseInt(r.qty) || 0, minQty: parseInt(r.minQty) || 5, unit: r.unit || 'قطعة'
      });
      added++;
    });
    state.categories = [...newCats];
    state.moves.unshift({ id: uid(), date: Date.now(), productId:null, productName:'استيراد جماعي', type:'in', qty: added, reason: `استيراد ${added} منتج من ملف` });
    await save('products'); await save('categories'); await save('moves');
    closeModal();
    renderAll();
    toast(`تم استيراد ${added} منتج بنجاح`);
  };
  reader.readAsText(file, 'UTF-8');
}

/* ---------------- cart state (in-memory only) ---------------- */
let cart = []; // {productId, name, price, buyPrice, qty}

function addToCart(p){
  if(p.qty <= 0){ toast('هذا المنتج غير متوفر بالمخزون'); return; }
  const line = cart.find(c => c.productId === p.id);
  const already = line ? line.qty : 0;
  if(already + 1 > p.qty){ toast('الكمية المتاحة في المخزون: ' + p.qty); return; }
  if(line) line.qty += 1;
  else cart.push({ productId:p.id, name:p.name, price:p.sellPrice, buyPrice:p.buyPrice, qty:1 });
  renderCart();
}
function changeCartQty(productId, delta){
  const line = cart.find(c => c.productId === productId);
  if(!line) return;
  const p = findProduct(productId);
  const next = line.qty + delta;
  if(next <= 0){ cart = cart.filter(c => c.productId !== productId); renderCart(); return; }
  if(p && next > p.qty){ toast('الكمية المتاحة في المخزون: ' + p.qty); return; }
  line.qty = next;
  renderCart();
}
function removeCartLine(productId){
  cart = cart.filter(c => c.productId !== productId);
  renderCart();
}
function cartTotal(){ return cart.reduce((s,c) => s + c.price*c.qty, 0); }

  if(!el){

    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);

}

async function confirmSale(){
  if(cart.length === 0) return;
  const subtotal = cartTotal();
  const discount = Math.min(parseFloat(document.getElementById('discountInput').value) || 0, subtotal);
  const taxable = subtotal - discount;
  const tax = taxable * ((state.settings.taxRate||0)/100);
  const total = taxable + tax;
  const paymentMethod = document.getElementById('paymentMethod').value;
  const received = parseFloat(document.getElementById('cashReceived').value) || 0;
  const invoiceNo = state.settings.invoiceCounter || 1000;
  state.settings.invoiceCounter = invoiceNo + 1;
  const sale = {
    id: uid(),
    invoiceNo,
    date: Date.now(),
    items: cart.map(c => ({ productId:c.productId, name:c.name, qty:c.qty, price:c.price, buyPrice:c.buyPrice })),
    subtotal, discount, tax, total, paymentMethod, received, change: received - total,
    cashierName: currentUser ? currentUser.name : '',
    returned: false
  };
  // decrement stock + log movement
  cart.forEach(c => {
    const p = findProduct(c.productId);
    if(p){
      p.qty = Math.max(0, p.qty - c.qty);
      state.moves.unshift({ id: uid(), date: Date.now(), productId:p.id, productName:p.name, type:'out', qty:c.qty, reason:'بيع فاتورة #'+invoiceNo });
    }
  });
  state.sales.unshift(sale);
  await save('products'); await save('moves'); await save('sales'); await save('settings');
  showReceipt(sale);
  cart = [];
  renderCart(); renderPosList(); renderStockView(); renderReports();
}

function catOptions(selected){

}
const unitOptions = ['قطعة','كرتونة','كيلو','لتر','علبة','كيس'];

function openProductForm(p){
  const editing = !!p;
  openModal(`
    <div class="modal-title">${editing ? 'تعديل منتج' : 'إضافة منتج جديد'}</div>
    <div class="field"><label>اسم المنتج</label><input id="f_name" value="${editing?p.name:''}"></div>

    </div>

      <div class="field"><label>الكمية الحالية</label><input id="f_qty" type="number" inputmode="numeric" value="${editing?p.qty:0}" ${editing?'disabled':''}></div>
      <div class="field"><label>حد التنبيه الأدنى</label><input id="f_min" type="number" inputmode="numeric" value="${editing?p.minQty:5}"></div>
    </div>
    ${editing?'<div class="muted" style="margin:-4px 0 10px;">لتعديل الكمية استخدم "تسجيل حركة مخزون" من تبويب المخزون.</div>':''}
    <div class="field"><label>وحدة القياس</label>
      <select id="f_unit">${unitOptions.map(u=>`<option ${editing&&p.unit===u?'selected':''}>${u}</option>`).join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label>المورد (اختياري)</label><input id="f_supplier" list="supplierList" value="${editing?(p.supplier||''):''}"></div>
      <div class="field"><label>تاريخ الصلاحية (اختياري)</label><input id="f_expiry" type="date" value="${editing?(p.expiryDate||''):''}"></div>
    </div>

    ${editing?'<button class="btn btn-danger btn-block" id="delProdBtn">حذف المنتج</button>':''}
  `);
  document.getElementById('f_category').addEventListener('change', (e) => {
    if(e.target.value === '__new__'){
      const nc = prompt('اسم الفئة الجديدة:');
      if(nc && nc.trim()){
        state.categories.push(nc.trim()); save('categories');
        e.target.innerHTML = catOptions(nc.trim()) + '<option value="__new__">+ فئة جديدة</option>';
      } else { e.target.value = state.categories[0]; }
    }
  });
  document.getElementById('saveProdBtn').addEventListener('click', async () => {
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('اكتب اسم المنتج'); return; }

      name,
      barcode: document.getElementById('f_barcode').value.trim(),

      sellPrice: parseFloat(document.getElementById('f_sell').value) || 0,

      supplier: document.getElementById('f_supplier').value.trim(),
      expiryDate: document.getElementById('f_expiry').value || '',
    };
    if(data.supplier && !state.suppliers.includes(data.supplier)){
      state.suppliers.push(data.supplier);

    } else {
      data.qty = parseInt(document.getElementById('f_qty').value) || 0;

/* ================= RENDER: STOCK / MOVEMENTS ================= */
function renderStockView(){
  const low = state.products.filter(p => p.qty <= p.minQty);
  const expiring = state.products.filter(p => { const d = daysToExpiry(p.expiryDate); return d !== null && d <= 7; });
  const banner = document.getElementById('lowStockBanner');
  let bannerHtml = '';
  if(low.length){
    bannerHtml += `<div class="card" style="background:var(--amber-soft); border-color:#EAD8AE; margin-bottom:8px;">
      <b style="color:var(--amber);">تنبيه:</b> ${low.length} منتج بحاجة لإعادة تعبئة (${low.slice(0,3).map(p=>p.name).join('، ')}${low.length>3?'...':''})
    </div>`;
  }
  if(expiring.length){
    bannerHtml += `<div class="card" style="background:var(--danger-soft); border-color:#F0CFC9; margin-bottom:8px;">
      <b style="color:var(--danger);">صلاحية:</b> ${expiring.length} منتج قربت أو انتهت صلاحيته (${expiring.slice(0,3).map(p=>p.name).join('، ')}${expiring.length>3?'...':''})
    </div>`;
  }
  banner.innerHTML = bannerHtml;
  const wrap = document.getElementById('movesList');
  const recent = state.moves.slice(0, 25);
  if(recent.length === 0){ wrap.innerHTML = '<div class="empty">لا توجد حركات مخزون بعد.</div>'; return; }
  wrap.innerHTML = recent.map(m => `
    <div class="move-item">
      <div class="top">
        <span>${m.productName}</span>
        <span class="num" style="color:${m.type==='in'?'var(--primary-dark)':(m.type==='out'?'var(--danger)':'var(--amber)')}">
          ${m.type==='in'?'+':(m.type==='out'?'-':'~')}${m.qty}
        </span>
      </div>
      <div class="muted">${m.reason || ''} · ${fmtDateShort(m.date)}</div>
    </div>
  `).join('');
}

document.getElementById('openMoveBtn').addEventListener('click', () => {
  openModal(`
    <div class="modal-title">تسجيل حركة مخزون</div>
    <div class="field">
      <label>المنتج</label>
      <input id="m_prod_search" placeholder="ابحث بالاسم أو الباركود" autocomplete="off">
      <input type="hidden" id="m_prod_id">
      <div id="m_prod_results" class="stack" style="margin-top:6px; max-height:180px; overflow-y:auto;"></div>
    </div>
    <div class="field">
      <label>نوع الحركة</label>
      <select id="m_type">
        <option value="in">وارد (إضافة للمخزون)</option>
        <option value="out">منصرف (سحب من المخزون)</option>
        <option value="adjust">تسوية جرد (تصحيح الكمية الفعلية)</option>
      </select>
    </div>
    <div class="field" id="m_qty_wrap"><label>الكمية</label><input id="m_qty" type="number" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>السبب / ملاحظة</label><input id="m_reason" placeholder="مثال: توريد من المورد"></div>
    <button class="btn btn-primary btn-block" id="saveMoveBtn">حفظ الحركة</button>
  `);
  const searchInput = document.getElementById('m_prod_search');
  const resultsWrap = document.getElementById('m_prod_results');
  function renderMoveResults(term){
    const t = term.trim().toLowerCase();
    if(!t){ resultsWrap.innerHTML = ''; return; }
    const matches = state.products.filter(p => p.name.toLowerCase().includes(t) || (p.barcode||'').includes(t)).slice(0, 20);
    resultsWrap.innerHTML = matches.map(p => `
      <div class="prod-item" data-pick="${p.id}" style="padding:8px 10px;">
        <div><div class="name" style="font-size:13px;">${p.name}</div><div class="sub">متاح: ${p.qty} ${p.unit||''}</div></div>
      </div>
    `).join('') || '<div class="empty" style="padding:10px;">لا يوجد نتائج</div>';
  }
  searchInput.addEventListener('input', debounce(() => renderMoveResults(searchInput.value), 120));
  resultsWrap.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if(!pick) return;
    const p = findProduct(pick.getAttribute('data-pick'));
    if(!p) return;
    document.getElementById('m_prod_id').value = p.id;
    searchInput.value = p.name + ' (متاح: ' + p.qty + ')';
    resultsWrap.innerHTML = '';
  });
  const typeSel = document.getElementById('m_type');
  const qtyWrap = document.getElementById('m_qty_wrap');
  function refreshQtyLabel(){
    qtyWrap.querySelector('label').textContent = typeSel.value === 'adjust' ? 'الكمية الفعلية بعد الجرد' : 'الكمية';
  }
  typeSel.addEventListener('change', refreshQtyLabel);
  document.getElementById('saveMoveBtn').addEventListener('click', async () => {
    const p = findProduct(document.getElementById('m_prod_id').value);
    const type = typeSel.value;
    const val = parseInt(document.getElementById('m_qty').value);
    const reason = document.getElementById('m_reason').value.trim();
    if(!p){ toast('اختر منتج من نتائج البحث'); return; }
    if(isNaN(val) || val < 0){ toast('أدخل كمية صحيحة'); return; }
    let moveQty = val;
    if(type === 'in') p.qty += val;
    else if(type === 'out'){
      if(val > p.qty){ toast('الكمية أكبر من المتاح (' + p.qty + ')'); return; }
      p.qty -= val;
    } else if(type === 'adjust'){
      moveQty = Math.abs(val - p.qty);
      p.qty = val;
    }
    state.moves.unshift({ id: uid(), date: Date.now(), productId:p.id, productName:p.name, type, qty: moveQty, reason: reason || (type==='adjust'?'تسوية جرد':'') });
    await save('products'); await save('moves');
    closeModal();
    renderStockView(); renderPosList(); renderProdMgmt(); renderReports();
  });
});

let currentRange = 'today';
document.getElementById('rangeChips').addEventListener('click', e => {
  const chip = e.target.closest('[data-range]');

  currentRange = chip.getAttribute('data-range');

function rangeStart(){
  const d = new Date();
  if(currentRange === 'today'){ d.setHours(0,0,0,0); return d.getTime(); }
  if(currentRange === 'week'){ return Date.now() - 7*24*3600*1000; }
  if(currentRange === 'month'){ return Date.now() - 30*24*3600*1000; }
  return 0;
}
function renderReports(){
  const start = rangeStart();
  const sales = state.sales.filter(s => s.date >= start);
  const activeSales = sales.filter(s => !s.returned);
  const revenue = activeSales.reduce((s,x)=>s+x.total,0);
  const profit = activeSales.reduce((s,x)=> s + x.items.reduce((s2,i)=> s2 + (i.price-i.buyPrice)*i.qty, 0), 0);
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-box"><div class="v num">${activeSales.length}</div><div class="l">عدد الفواتير</div></div>
    <div class="stat-box"><div class="v num">${money(revenue)}</div><div class="l">إجمالي المبيعات</div></div>
    <div class="stat-box"><div class="v num">${money(profit)}</div><div class="l">الربح التقديري</div></div>
    <div class="stat-box"><div class="v num">${state.products.length}</div><div class="l">عدد المنتجات</div></div>
  `;
  const soldMap = {};
  activeSales.forEach(s => s.items.forEach(i => { soldMap[i.name] = (soldMap[i.name]||0) + i.qty; }));
  const top = Object.entries(soldMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('topProducts').innerHTML = top.length ? top.map(([name,qty]) => `
    <div class="row between" style="padding:5px 0; border-bottom:1px solid var(--line); font-size:13.5px;">
      <span>${name}</span><span class="num" style="font-weight:700;">${qty}</span>
    </div>
  `).join('') : '<div class="empty">لا توجد مبيعات في هذه الفترة.</div>';

  const low = state.products.filter(p => p.qty <= p.minQty);
  document.getElementById('lowStockList').innerHTML = low.length ? low.map(p => `
    <div class="row between" style="padding:5px 0; border-bottom:1px solid var(--line); font-size:13.5px;">
      <span>${p.name}</span><span class="num">${p.qty} ${stockPill(p)}</span>
    </div>
  `).join('') : '<div class="empty">لا يوجد نواقص حاليًا 👍</div>';

  const wrapHist = document.getElementById('salesHistory');
  const recentSales = sales.slice(0, 20);
  wrapHist.innerHTML = recentSales.length ? recentSales.map(s => `
    <div class="row between" style="padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;" data-sale="${s.id}">
      <div>
        <div style="font-weight:700;">فاتورة #${s.invoiceNo ?? '—'} ${s.returned?'<span class="pill pill-bad">مرتجعة</span>':''}</div>
        <div class="muted">${fmtDateShort(s.date)} · ${s.cashierName||''}</div>
      </div>
      <div class="num" style="font-weight:700;">${money(s.total)}</div>
    </div>
  `).join('') : '<div class="empty">لا توجد فواتير في هذه الفترة.</div>';
}

      <hr class="line">
      <div class="rline"><span>الإجمالي الفرعي</span><span class="num">${money(s.subtotal ?? s.total)}</span></div>
      ${s.discount ? `<div class="rline"><span>الخصم</span><span class="num">-${money(s.discount)}</span></div>` : ''}
      ${s.tax ? `<div class="rline"><span>الضريبة</span><span class="num">${money(s.tax)}</span></div>` : ''}
      <div class="rline tot"><span>الإجمالي</span><span class="num">${money(s.total)}</span></div>

    </div>

  `);
  if(!s.returned){

      if(!confirm('سيتم إرجاع كل الأصناف للمخزون وتعليم الفاتورة كمرتجعة. متأكد؟')) return;
      s.items.forEach(i => {
        const p = findProduct(i.productId);
        if(p){
          p.qty += i.qty;
          state.moves.unshift({ id: uid(), date: Date.now(), productId:p.id, productName:p.name, type:'in', qty:i.qty, reason:'مرتجع فاتورة #'+s.invoiceNo });

      await save('products'); await save('moves'); await save('sales');

document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
  const hasUsers = state.users.length > 0;
  const username = document.getElementById('l_username').value.trim();
  const password = document.getElementById('l_password').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!username || !password){ errEl.textContent = 'من فضلك أدخل اسم المستخدم وكلمة المرور'; errEl.style.display = 'block'; return; }
  const email = usernameToEmail(username);

  // إنشاء أول حساب مدير (أول تشغيل للنظام)
  if(!hasUsers){
    const fullname = document.getElementById('l_fullname').value.trim();
    if(!fullname){ errEl.textContent = 'من فضلك أدخل اسمك'; errEl.style.display = 'block'; return; }
    if(password.length < 4){ errEl.textContent = 'كلمة المرور 4 أحرف على الأقل'; errEl.style.display = 'block'; return; }
    try{
      const cred = auth ? await auth.createUserWithEmailAndPassword(email, password) : null;
      const admin = { id: cred ? cred.user.uid : uid(), name: fullname, username, role: 'admin' };
      state.users.push(admin);
      await save('users');
      currentUser = admin;
      await loadAll(); // إعادة تحميل كل بيانات المتجر دلوقتي وإحنا مسجلين دخول فعليًا
      currentUser = admin; // loadAll() بتستبدل state.users بالكامل، فبنثبت المستخدم الحالي تاني
      showApp();
    }catch(e){
      errEl.textContent = 'تعذر إنشاء الحساب — جرب اسم مستخدم مختلف. (' + (e.code || e.message || '') + ')';
      errEl.style.display = 'block';
    }
    return;
  }

  // تسجيل دخول عادي، مع ترحيل تلقائي لأي حساب اتعمل قبل تفعيل Firebase Auth
  try{
    if(!auth) throw new Error('no-auth');
    let cred;
    try{
      cred = await auth.signInWithEmailAndPassword(email, password);
    }catch(authErr){
      const legacyUser = state.users.find(u => u.username === username && u.password && u.password === simpleHash(password));
      if(!legacyUser) throw authErr;
      cred = await auth.createUserWithEmailAndPassword(email, password);
      legacyUser.id = cred.user.uid;
      delete legacyUser.password;
      await save('users');
    }
    const user = state.users.find(u => u.id === cred.user.uid) || state.users.find(u => u.username === username);
    if(!user){ errEl.textContent = 'الحساب مش موجود في قائمة مستخدمي المتجر'; errEl.style.display = 'block'; if(auth) auth.signOut().catch(()=>{}); return; }
    currentUser = user;
    await loadAll(); // إعادة تحميل كل بيانات المتجر دلوقتي وإحنا مسجلين دخول فعليًا (بعد ما كانت اتمنعت قبل الدخول)
    currentUser = state.users.find(u => u.id === user.id) || user; // loadAll() بتستبدل state.users، فبنعيد إيجاد نفس المستخدم
    showApp();
  }catch(e){
    errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    errEl.style.display = 'block';
  }
});

/* ================= SETTINGS ================= */
function storageModeLabel(){
  if(storageMode === 'firebase') return '☁️ متصل بقاعدة بيانات سحابية — نفس البيانات على أي جهاز';
  if(storageMode === 'claude') return '💾 حفظ داخل Claude';
  if(storageMode === 'browser') return '📱 حفظ محلي على هذا الجهاز فقط';
  return '⚠️ بدون حفظ دائم (بيانات هذه الجلسة فقط)';
}
function openSettings(){
  const isAdmin = currentUser && currentUser.role === 'admin';
  openModal(`
    <div class="modal-title">الإعدادات</div>
    <div class="card" style="margin-bottom:10px;">
      <div class="row between">
        <div>
          <div style="font-weight:700;">${currentUser.name}</div>
          <div class="muted">${isAdmin?'مدير':'كاشير'} · ${currentUser.username}</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">تسجيل الخروج</button>
      </div>
    </div>
    <div class="muted" style="margin-bottom:14px; font-size:12px;">${storageModeLabel()}</div>
    ${isAdmin ? `
    <div class="field"><label>اسم المتجر</label><input id="s_name" value="${state.settings.storeName}"></div>
    <div class="field-row">
      <div class="field"><label>نسبة الضريبة %</label><input id="s_tax" type="number" inputmode="decimal" value="${state.settings.taxRate||0}"></div>
      <div class="field"><label>رمز العملة</label><input id="s_currency" value="${state.settings.currency||'ج.م'}"></div>
    </div>
    <button class="btn btn-primary btn-block" id="saveSettingsBtn" style="margin-bottom:16px;">حفظ</button>
    <hr class="line">
    <div class="row between" style="margin:12px 0 8px;">
      <div class="h2" style="margin:0;">المستخدمون</div>
      <button class="btn btn-outline btn-sm" id="addUserBtn">+ إضافة</button>
    </div>
    <div id="usersList"></div>
    <hr class="line">
    <div class="h2" style="margin:12px 0 8px;">النسخ الاحتياطي</div>
    <div class="muted" style="margin-bottom:8px;">نزّل نسخة من كل بياناتك (منتجات، مبيعات، مستخدمين) كملف تقدر تستعيدها بيه على أي نسخة تانية من النظام.</div>
    <button class="btn btn-outline btn-block" id="exportBtn" style="margin-bottom:8px;">تنزيل نسخة احتياطية</button>
    <label class="btn btn-ghost btn-block" style="text-align:center; margin-bottom:16px;">
      استيراد نسخة احتياطية
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </label>
    <hr class="line">
    <div class="muted" style="margin:12px 0 8px;">حذف كل البيانات (المنتجات، المبيعات، الحركات) نهائيًا:</div>
    <button class="btn btn-danger btn-block" id="resetAllBtn">مسح كل البيانات</button>
    ` : ''}
  `);
  document.getElementById('logoutBtn').addEventListener('click', () => { closeModal(); logout(); });
  if(isAdmin){
    renderUsersList();
    document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
      state.settings.storeName = document.getElementById('s_name').value.trim() || 'متجري';
      state.settings.taxRate = parseFloat(document.getElementById('s_tax').value) || 0;
      state.settings.currency = document.getElementById('s_currency').value.trim() || 'ج.م';
      await save('settings');
      document.querySelector('#storeNameBtn').textContent = '🏪 ' + state.settings.storeName;
      document.title = state.settings.storeName;
      closeModal();
      renderAll();
    });
    document.getElementById('addUserBtn').addEventListener('click', openUserForm);
    document.getElementById('exportBtn').addEventListener('click', exportBackup);
    document.getElementById('importFile').addEventListener('change', importBackup);
    document.getElementById('resetAllBtn').addEventListener('click', async () => {
      if(!confirm('سيتم حذف كل البيانات نهائيًا، هل أنت متأكد؟')) return;
      state.products = []; state.sales = []; state.moves = []; cart = [];
      await save('products'); await save('sales'); await save('moves');
      closeModal();
      renderAll();
    });
  }
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('storeNameBtn').addEventListener('click', openSettings);

function renderUsersList(){
  const wrap = document.getElementById('usersList');
  if(!wrap) return;
  wrap.innerHTML = state.users.map(u => `
    <div class="row between" style="padding:8px 0; border-bottom:1px solid var(--line);">
      <div>
        <div style="font-weight:700; font-size:13.5px;">${u.name} ${u.id===currentUser.id?'(أنت)':''}</div>
        <div class="muted">${u.role==='admin'?'مدير':'كاشير'} · ${u.username}</div>
      </div>
      ${u.id!==currentUser.id ? `<button class="btn btn-danger btn-sm" data-deluser="${u.id}">حذف</button>` : ''}
    </div>
  `).join('');
  wrap.querySelectorAll('[data-deluser]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('حذف هذا المستخدم؟')) return;
      state.users = state.users.filter(x => x.id !== btn.getAttribute('data-deluser'));
      await save('users');
      renderUsersList();
    });
  });
}

function openUserForm(){
  openModal(`
    <div class="modal-title">إضافة مستخدم جديد</div>
    <div class="field"><label>الاسم</label><input id="u_name"></div>
    <div class="field"><label>اسم المستخدم (للدخول)</label><input id="u_username" autocomplete="off"></div>
    <div class="field"><label>كلمة المرور</label><input id="u_password" type="password"></div>
    <div class="field"><label>الصلاحية</label>
      <select id="u_role">
        <option value="cashier">كاشير — شاشة البيع فقط</option>
        <option value="admin">مدير — كل الصلاحيات</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" id="saveUserBtn">إضافة المستخدم</button>
  `);
  document.getElementById('saveUserBtn').addEventListener('click', async () => {
    const name = document.getElementById('u_name').value.trim();
    const username = document.getElementById('u_username').value.trim();
    const password = document.getElementById('u_password').value;
    const role = document.getElementById('u_role').value;
    if(!name || !username || password.length < 4){ toast('املأ البيانات، وكلمة المرور 4 أحرف على الأقل'); return; }
    if(state.users.some(x => x.username === username)){ toast('اسم المستخدم مستخدم بالفعل'); return; }
    try{
      let newId = uid();
      if(secondaryAuth){
        const email = usernameToEmail(username);
        const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
        newId = cred.user.uid;
        await secondaryAuth.signOut();
      }
      state.users.push({ id: newId, name, username, role });
      await save('users');
      openSettings();
    }catch(e){
      toast('تعذر إنشاء المستخدم — ' + (e.code === 'auth/email-already-in-use' ? 'اسم المستخدم مستخدم بالفعل' : (e.message || '')));
    }
  });
}

/* ================= BACKUP / RESTORE ================= */
function exportBackup(){
  const backup = {
    exportedAt: Date.now(),
    products: state.products, sales: state.sales, moves: state.moves,
    categories: state.categories, settings: state.settings, users: state.users,
    suppliers: state.suppliers, parked: state.parked
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'نسخة-احتياطية-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. متأكد؟')) return;
      state.products = data.products || [];
      state.sales = data.sales || [];
      state.moves = data.moves || [];
      state.categories = data.categories && data.categories.length ? data.categories : ['عام'];
      state.settings = Object.assign({ storeName:'متجري', taxRate:0, currency:'ج.م', invoiceCounter:1000 }, data.settings || {});
      state.suppliers = data.suppliers || [];
      state.parked = data.parked || [];
      // keep current logged-in users as-is unless the backup has its own
      if(data.users && data.users.length) state.users = data.users;
      await Promise.all(['products','sales','moves','categories','settings','suppliers','parked','users'].map(save));
      closeModal();
      document.querySelector('#storeNameBtn').textContent = '🏪 ' + state.settings.storeName;
      renderAll();
      toast('تم استيراد النسخة الاحتياطية بنجاح');
    }catch(err){
      toast('الملف غير صالح، تأكد إنه نسخة احتياطية صحيحة');
    }
  };
  reader.readAsText(file);
}

/* ================= INIT ================= */
function renderAll(){
  renderPosChips(); renderPosList(); renderCart(); renderParkedSection();
  renderProdMgmt(); renderStockView(); renderReports();
}

(async function init(){
  document.getElementById('todayDate').textContent = todayStr();
  await loadAll();
  document.getElementById('storeNameBtn').textContent = '🏪 ' + state.settings.storeName;
  document.title = state.settings.storeName;
  document.getElementById('splash').style.display = 'none';
  showLoginScreen();
  if(!storageOK) toast('تنبيه: المتصفح ده مش بيدعم الحفظ الدائم، البيانات هتُحفظ لهذه الجلسة فقط');
})();

})();
</script>
