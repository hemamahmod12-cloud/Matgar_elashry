version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '03:00'
    open-pull-requests-limit: 10
    labels: ['dependencies', 'security']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      minor-updates:
        applies-to: version-updates
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels: ['ci-cd']
