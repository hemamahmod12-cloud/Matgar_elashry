name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate auth aliases
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-save --no-package-lock firebase-admin@latest
          node scripts/generate-auth-aliases.cjs

      - name: Embed auth aliases in the application shell
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const aliases = JSON.parse(fs.readFileSync('auth-aliases.json', 'utf8'));
          const file = 'index.html';
          const html = fs.readFileSync(file, 'utf8');
          const injection = `<script>window.__MATGAR_AUTH_ALIASES__=${JSON.stringify(aliases)};</script>`;
          const start = '<!-- AUTH_ALIASES_START -->';
          const end = '<!-- AUTH_ALIASES_END -->';
          if (!html.includes(start) || !html.includes(end)) throw new Error('auth alias markers missing');
          const from = html.indexOf(start);
          const to = html.indexOf(end, from) + end.length;
          fs.writeFileSync(file, html.slice(0, from) + start + injection + end + html.slice(to));
          fs.unlinkSync('auth-aliases.json');
          NODE

      - name: Persist generated auth aliases in main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: embed current auth aliases [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
