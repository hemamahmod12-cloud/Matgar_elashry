name: Deploy Cloud Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Validate function source
        run: node --check functions/src/index.js

      - name: Write temporary service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy functions only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions --project story-market-35565 --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
